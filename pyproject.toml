[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sja-sport"
version = "0.1.0"
description = "Single-account SJTU sports core with CLI and Web heads"
requires-python = ">=3.11"
dependencies = ["httpx[http2,socks]>=0.27,<1", "pydantic>=2,<3", "pycryptodome>=3.21,<4", "websockets>=17,<18"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
secure = ["cryptography>=44"]
web = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.scripts]
sja = "sja_booking.cli:main"

[tool.setuptools.packages.find]
include = ["sja_booking*", "web_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
